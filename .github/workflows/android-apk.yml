name: Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Play versionCode (incrémenter à chaque AAB)'
        required: true
      lastPublishedVersionCode:
        description: 'Highest versionCode in Play Console (all tracks; verify before building)'
        required: true
  # Livraison site uniquement : les builds Android exigent une demande manuelle
  # explicite (politique testée : tests/lens-reference-parity.test.ts interdit
  # tout déclencheur `push:` ici). Le 04/10/2026, un déclencheur push ajouté
  # pour « construire l'app automatiquement » a cassé la CI — retiré.

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      AYROVI_VERSION_CODE: ${{ github.event.inputs.versionCode }}
      AYROVI_VERSION_NAME: ${{ github.event.inputs.versionCode && format('1.0.{0}', github.event.inputs.versionCode) || '1.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Build web (vite → public/) + sync into android assets
        run: npm run build:client && npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK 36
        # Pas d'action tierce : `android-actions/setup-android@v3` échoue sur
        # l'image ubuntu-latest courante (étape en échec en 11 s le 05/10/2026).
        # Le SDK est déjà présent ; on n'ajoute que les paquets manquants.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            # Dernier recours : installer cmdline-tools dans le SDK existant.
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          # L'image peut appartenir à un autre utilisateur : rendre le SDK inscriptible.
          if [ ! -w "$ANDROID_HOME" ]; then sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Validate release version
        env:
          LAST: ${{ github.event.inputs.lastPublishedVersionCode }}
        run: |
          node -e "const n=Number(process.env.AYROVI_VERSION_CODE), last=Number(process.env.LAST); if(!Number.isSafeInteger(n)||!Number.isSafeInteger(last)||last<0||n<=last||n>2100000000) process.exit(1)"
      - name: Debug APK (test direct sur téléphone)
        # `sh ./gradlew` (et non `./gradlew`) : l'échec CI du 03/10 (exit 126,
        # « permission denied » à l'exécution directe du wrapper) ne peut plus
        # se produire — l'interpréteur est invoqué explicitement.
        run: cd android && sh ./gradlew assembleDebug --no-daemon

      - name: Verify debug signing
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "CN=Android Debug"'
      - uses: actions/upload-artifact@v4
        with:
          name: AYROVI-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # secrets ne sont PAS lisibles dans un `if` d'étape → drapeau via GITHUB_OUTPUT
      - name: Detect release signing secrets
        id: sign
        env:
          KS: ${{ secrets.AYROVI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Release AAB signé (Play Store) — seulement si le keystore est configuré
        if: steps.sign.outputs.available == 'true'
        env:
          AYROVI_KEYSTORE_BASE64: ${{ secrets.AYROVI_KEYSTORE_BASE64 }}
          AYROVI_KEYSTORE_PASSWORD: ${{ secrets.AYROVI_KEYSTORE_PASSWORD }}
          AYROVI_KEY_ALIAS: ${{ secrets.AYROVI_KEY_ALIAS }}
          AYROVI_KEY_PASSWORD: ${{ secrets.AYROVI_KEY_PASSWORD }}
        run: cd android && sh ./gradlew bundleRelease --no-daemon

      - name: Verify release AAB signature
        if: steps.sign.outputs.available == 'true'
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep 'jar verified'
          if keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q 'CN=Android Debug'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.available == 'true'
        with:
          name: AYROVI-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
