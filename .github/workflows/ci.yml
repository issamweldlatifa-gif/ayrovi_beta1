name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Check generated identity and source inventory
        run: npm run design:check

      - name: Enforce official AYROVI A identity
        run: npm run identity:check && npm run identity:test

      - name: Typecheck
        run: npm run typecheck

      # HTTP/SPA contract tests require the generated public/index.html.
      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Install reference browser
        run: npx playwright install --with-deps chromium firefox

      - name: Clear previously tracked browser evidence
        run: rm -rf docs/editorial/verification/ screenshots/editorial/customer/ screenshots/editorial/complete-icons/ screenshots/editorial/icon-correction/account/ screenshots/editorial/sonim-actions/ screenshots/editorial/sonim-history/ screenshots/editorial/sonim-media/ screenshots/editorial/sonim-playback/ screenshots/editorial/sonim-handsfree/ screenshots/editorial/variant-availability/ screenshots/editorial/product-selection/

      - name: Verify official fonts, changing prices, admin and PDF
        run: npm run verify:identity

      - name: Upload official identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-a-evidence
          path: docs/identity-a/evidence/

      - name: Verify editorial reference
        id: editorial_reference
        run: npm run design:browser

      - name: Upload editorial reference evidence
        if: ${{ !cancelled() && (steps.editorial_reference.outcome == 'success' || steps.editorial_reference.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-reference-evidence
          path: docs/editorial/verification/

      - name: Verify real customer screens (isolated providers and SQLite)
        id: editorial_customer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run verify:editorial-customer > /tmp/customer-check.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo 'Customer screen check failed:'
              echo '```'
              tail -c 6000 /tmp/customer-check.log
              echo '```'
            } > /tmp/customer-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/customer-comment.md || true
          fi
          exit "$code"

      - name: Verify additive homepage, standalone pages and footer
        run: |
          rm -rf docs/public-additions/evidence/
          npm run verify:public-additions

      - name: Upload public additions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-additions-evidence
          path: docs/public-additions/evidence/

      - name: Verify Lens camera entry, help, consent and navigation
        id: lens_camera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Local evidence is versioned for review; never upload it as this run's output.
          rm -rf docs/lens-phase1/evidence/
          set +e
          npm run verify:lens-camera > /tmp/lens-camera.log 2>&1
          code=$?
          cat /tmp/lens-camera.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Lens camera check failed:'
              echo '```'
              tail -c 6000 /tmp/lens-camera.log
              echo '```'
            } > /tmp/lens-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lens-comment.md || true
          fi
          exit "$code"

      - name: Upload Lens entry evidence
        if: ${{ !cancelled() && (steps.lens_camera.outcome == 'success' || steps.lens_camera.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lens-camera-evidence
          path: docs/lens-phase1/evidence/

      - name: Verify Lens image selection and sliding results
        id: lens_results
        run: |
          rm -rf docs/lens-results/evidence/
          npm run verify:lens-results

      - name: Upload fresh Lens results evidence
        if: ${{ !cancelled() && (steps.lens_results.outcome == 'success' || steps.lens_results.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lens-results-evidence
          path: docs/lens-results/evidence/

      - name: Verify reference product cards, real ratings and favorites
        id: lens_cards
        run: |
          rm -rf docs/lens-product-cards/evidence/
          npm run verify:lens-cards

      - name: Upload fresh Lens product card evidence
        if: ${{ !cancelled() && (steps.lens_cards.outcome == 'success' || steps.lens_cards.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lens-product-cards-evidence
          path: docs/lens-product-cards/evidence/

      - name: Verify editorial voice, products and all icon imports
        run: npm run verify:editorial-states

      - name: Verify SONIM message actions and nested navigation
        run: npm run verify:sonim-actions

      - name: Verify SONIM history persistence and quote freshness
        run: |
          set +e
          npm run verify:sonim-history > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify SONIM history persistence and quote freshness failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify SONIM media ownership and cancellation
        run: |
          set +e
          npm run verify:sonim-media > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify SONIM media ownership and cancellation failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify SONIM output cancellation and truthful settings
        run: |
          set +e
          npm run verify:sonim-playback > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify SONIM output cancellation and truthful settings failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify SONIM hands-free capture isolation
        run: |
          set +e
          npm run verify:sonim-handsfree > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify SONIM hands-free capture isolation failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify merchant availability and variant eligibility
        run: |
          set +e
          npm run verify:variant-availability > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify merchant availability and variant eligibility failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify product selection and quote coherence
        run: |
          set +e
          npm run verify:product-selection > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify product selection and quote coherence failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Verify signed mobile purchase flow against real pricing and cart endpoints
        run: |
          set +e
          npm run verify:purchase-flow > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify signed mobile purchase flow against real pricing and cart endpoints failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Upload mobile purchase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-purchase-evidence
          path: |
            .cache/mobile-purchase-check/
            .cache/purchase-parents-check/
            .cache/lens-enrichment-check/

      - name: Verify product image composition (ratio, no crop, safe area)
        run: |
          rm -rf screenshots/image-composition/
          npm run verify:image-composition

      - name: Upload composed product card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-composition-evidence
          path: screenshots/image-composition/

      - name: Verify authenticated account and icon geometry
        run: |
          set +e
          npm run verify:editorial-account > /tmp/verify-step.log 2>&1
          code=$?
          cat /tmp/verify-step.log
          if [ "$code" -ne 0 ]; then
            {
              echo 'Verify authenticated account and icon geometry failed:'
              echo '```'
              tail -c 6000 /tmp/verify-step.log
              echo '```'
            } > /tmp/verify-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/verify-comment.md || true
          fi
          exit "$code"

      - name: Upload customer-screen evidence
        if: ${{ !cancelled() && (steps.editorial_customer.outcome == 'success' || steps.editorial_customer.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-customer-evidence
          path: |
            screenshots/editorial/customer/
            screenshots/editorial/complete-icons/
            screenshots/editorial/icon-correction/account/
            screenshots/editorial/sonim-actions/
            screenshots/editorial/sonim-history/
            screenshots/editorial/sonim-media/
            screenshots/editorial/sonim-playback/
            screenshots/editorial/sonim-handsfree/
            screenshots/editorial/variant-availability/
            screenshots/editorial/product-selection/
