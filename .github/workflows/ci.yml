name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated identity and source inventory
        run: npm run design:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Install reference browser
        run: npx playwright install --with-deps chromium

      - name: Verify editorial reference
        run: npm run design:browser

      - name: Upload editorial reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: editorial-reference-evidence
          path: docs/editorial/verification/

      - name: Build
        run: npm run build

      - name: Verify real customer screens (isolated providers and SQLite)
        run: npm run verify:editorial-customer

      - name: Upload customer-screen evidence
        uses: actions/upload-artifact@v4
        with:
          name: editorial-customer-evidence
          path: screenshots/editorial/customer/
