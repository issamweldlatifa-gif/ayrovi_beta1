name: Lens — détection Live du serveur (sonde)

# Répond à UNE question, avec un fait : « le mode Live de Z Lens repère-t-il
# vraiment des produits sur le serveur publié ? »
#
# Live (application mobile) envoie une image réduite à POST /api/ayrovix/detect
# dès que le téléphone est stable ; la photo et la Galerie s'en servent aussi
# pour poser le cadre sur le plus grand produit. Sans fournisseur IA configuré
# sur Render, la route répond 503 (AYROVIX_UNAVAILABLE) : Live ne fait alors que
# filmer et le cadre ne se pose sur aucun produit. Ça ne se voit pas dans le code.
#
# Lecture seule : aucun secret, aucune écriture, UNE détection (modèle vision
# rapide, photo de démonstration du dépôt). Toujours vert : c'est un instrument
# de mesure, pas une barrière. Le résultat est écrit en « annotation » pour être
# lu depuis l'API.
#
# ⚠️ `workflow_dispatch` n'est accepté que pour un workflow présent sur `main` :
# d'ici là, la sonde se relance par un push qui modifie ce fichier.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Serveur à interroger"
        required: true
        default: "https://ayrovi-beta1-moo8.onrender.com"
  push:
    branches: ['arena/*-ayrovi-beta1']
    paths:
      - '.github/workflows/lens-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Détection Live sur le serveur publié
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: ${{ inputs.base || 'https://ayrovi-beta1-moo8.onrender.com' }}
      CLIENT: mobile/probe
      # Une tenue complète (haut, bas, chaussures) : plusieurs produits à repérer.
      IMAGE: client/public/media/hero-homme.jpg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client/public/media

      - name: POST /api/ayrovix/detect avec une vraie photo
        run: |
          # Une absence de réponse est une MESURE, pas une panne du workflow.
          set +e +o pipefail
          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          rm -f /tmp/status.json /tmp/detect.json

          # Render peut dormir : le réveiller d'abord, sinon on mesure le réveil.
          READY=""
          for ATTEMPT in $(seq 1 12); do
            READY=$(curl -s --max-time 30 "$BASE/api/ready" 2>/dev/null)
            [ -n "$READY" ] && break
            sleep 10
          done
          COMMIT=$(printf '%s' "$READY" | sed -n 's/.*"commit": *"\([A-Za-z0-9]*\)".*/\1/p' | head -1)

          # Même fournisseur que /detect : getAyroviAiCore().responses().
          curl -s --max-time 30 -o /tmp/status.json "$BASE/api/assistant/status" 2>/dev/null
          AI=$(python3 -c 'import json
          try: d=json.load(open("/tmp/status.json")).get("data") or {}
          except Exception: d={}
          print("ai_ready=%s provider=%s" % (d.get("ready"), d.get("provider")))')

          START=$(date +%s%3N)
          CODE=$(curl -s -o /tmp/detect.json -w '%{http_code}' --max-time 60 \
            -H 'Accept: application/json' -H "x-ayrovi-client: $CLIENT" \
            -F "image=@$IMAGE;type=image/jpeg" \
            "$BASE/api/ayrovix/detect" 2>/dev/null)
          MS=$(( $(date +%s%3N) - START ))
          [ -z "$CODE" ] && CODE=000

          FACTS=$(python3 -c 'import json
          try: d=json.load(open("/tmp/detect.json"))
          except Exception: d={}
          data=(d.get("data") or {}) if isinstance(d, dict) else {}
          rows=[r for r in (data.get("products") or []) if isinstance(r, dict)]
          names="|".join("_".join(str(r.get("name") or "?").split())[:40] for r in rows[:8]) or "none"
          boxes="|".join(",".join("%.2f" % float(v) for v in (r.get("box") or [])[:4]) for r in rows[:8]) or "none"
          print("%d %s %s %s" % (len(rows), (d.get("code") if isinstance(d, dict) else None) or "none", names, boxes))')
          set -- ${FACTS:-0 unreadable none none}
          COUNT=${1:-0}; ERROR=${2:-unreadable}; NAMES=${3:-none}; BOXES=${4:-none}

          printf '## Détection Live sur `%s`\n\n' "$BASE" >> "$S"
          printf -- '- Commit servi : `%s`\n- Fournisseur IA : `%s`\n- `POST /api/ayrovix/detect` : **%s** en %s ms, %s produit(s), code `%s`\n- Produits : `%s`\n- Boîtes [x,y,w,h] : `%s`\n' \
            "${COMMIT:-?}" "$AI" "$CODE" "$MS" "$COUNT" "$ERROR" "$NAMES" "$BOXES" >> "$S"

          if [ "$CODE" = "200" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "::notice title=Detection Live OK::code=$CODE ms=$MS products=$COUNT names=$NAMES boxes=$BOXES commit=${COMMIT:-?} $AI"
          else
            echo "::warning title=Detection Live en panne::code=$CODE ms=$MS products=$COUNT error=$ERROR commit=${COMMIT:-?} $AI"
          fi
          exit 0
