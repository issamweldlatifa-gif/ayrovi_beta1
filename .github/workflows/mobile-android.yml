name: Mobile — APK Android (démo)

# Construit un APK RÉEL de l'application React Native sur les runners GitHub
# (JDK 17 + SDK Android), parce que l'environnement de développement n'a ni Java
# ni SDK Android.
#
# Ce n'est PAS l'APK de production : celui-ci viendra en P6 (keystore de
# l'application dans GitHub Secrets, `app-bundle` pour le Play Store).
#
# L'APK de démo porte un identifiant DISTINCT (`app.ayrovi.mobile.demo`) : il
# s'installe À CÔTÉ de l'application existante, sans la toucher. C'est le choix
# assumé tant que le keystore d'origine n'est pas disponible pour une mise à
# jour en place.
#
# ⚠️ FENNE GITHUB À CONNAÎTRE (coûte une heure de confusion le 16/10/2026)
#
# Une branche NOUVELLE créée sur un commit DÉJÀ présent ailleurs NE DÉCLENCHE
# AUCUN workflow. Constaté : `arena/b1aac3a9-ayrovi-beta1` et
# `arena/b3539284-ayrovi-beta1` pointaient sur un commit déjà poussé ailleurs —
# 0 check-suite, 0 run, aucun APK, et AUCUN message d'erreur. Le même commit,
# poussé sur une branche EXISTANTE, construit normalement.
#
# Règle : après avoir copié un autre branche, il faut pousser au moins UN
# nouveau commit sur la branche neuve pour que la CI démarre. C'est exactement
# ce que fait le commit qui ajoute cette documentation.
on:
  # ⚠️ GitHub n'accepte `workflow_dispatch` que pour un workflow présent sur la
  # branche PAR DÉFAUT. Tant que ce fichier n'est pas sur `main`, on déclenche
  # donc la construction par un `push` sur la branche de travail (le push qui
  # modifie l'application suffit). Une fois fusionné dans `main`, le bouton
  # manuel ci-dessous devient disponible tel quel — rien à changer.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Origine de l'API gravée dans l'application (`EXPO_PUBLIC_API_BASE_URL`)"
        required: true
        default: "https://ayrovi-beta1-moo8.onrender.com"
  push:
    # TOUTE branche de travail Arena (`arena/<session>-...`) : l'APK démo se
    # reconstruit après chaque mise à jour de l'application, quelle que soit la
    # session. Avant, chaque nouvelle session devait ajouter sa branche à une
    # liste écrite à la main (c0321e79, bc19f283, a41a200d, dbcc3118,
    # 6c61a279, 9fd9a9fc…) ; une branche oubliée = aucun APK, en silence.
    # Le motif `arena/**` épuise la famille : plus aucune liste à tenir à la main.
    branches: ['arena/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android.yml'
      # Un changement de CE workflow doit se tester lui-même : sans cette
      # ligne, corriger le pipeline (ou y ajouter une étape) ne se vérifierait
      # qu'au push suivant qui touche `apps/mobile/`.
      - '.github/workflows/mobile-release-aab.yml'

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK démo (release, signé debug)
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` : le job réécrit la mesure (APK_SIZES.md) dans le
      # dépôt. `actions: write` : il rallume les vérifications PR après ce
      # commit (dispatch de ci.yml + mobile.yml) — sinon le head du PR n'a
      # aucun check et la PR reste bloquée. Rien d'autre n'est demandé —
      # principe du moindre privilège.
      contents: write
      actions: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # تخزين مؤقّت لـGradle: بلا هذا، كل بناء يعاود ينزّل التوزيعة
          # والاعتماديات من الصفر (~20 دقيقة للبناء الواحد). مع التخزين،
          # البناء الجاي يمشي برشة أسرع.
          cache: gradle

      - name: Installer le SDK Android (sans action tierce)
        # `android-actions/setup-android@v3` échoue sur l'image ubuntu-latest
        # actuelle (constaté ici le 07/10/2026 — étape en échec, la suite sautée ;
        # déjà constaté le 05/10/2026 sur l'ancien pipeline Android). Le SDK est
        # déjà présent sur l'image : on accepte les licences et on n'ajoute que
        # les paquets utiles à ce projet — c'est ce qui a fonctionné jusqu'ici.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            # Dernier recours : installer cmdline-tools dans le SDK existant.
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          # L'image peut appartenir à un autre utilisateur : rendre le SDK inscriptible.
          if [ ! -w "$ANDROID_HOME" ]; then sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # `.npmrc` de l'application active legacy-peer-deps (graphe Expo + vitest).
      - name: Install
        run: npm ci

      # Projet natif généré à la volée (CNG) : aucun fichier natif n'est versionné.
      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      # EMPREINTE STABLE — pourquoi cette étape existe.
      #
      # Sans elle, Gradle fabrique une clé debug NEUVE sur chaque machine, donc
      # chaque build porte une EMPREINTE DIFFÉRENTE. Or `/.well-known/assetlinks.json`
      # (le fichier qui autorise Android à ouvrir nos liens dans l'application)
      # ne peut déclarer qu'une liste finie d'empreintes. Conséquence : « ouvrir
      # dans l'application » est INTABLE avec un APK de démonstration, quel que
      # soit le soin mis ailleurs.
      #
      # On dépose donc une clé debug VERSIONNÉE (c'est la clé de développement :
      # son mot de passe est public et elle ne sert JAMAIS à publier — l'AAB de
      # production est signé avec le vrai keystore, dans `mobile-release-aab.yml`).
      - name: Clé de démonstration fixe (liens profonds testables)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -importkeystore \
            -srckeystore keystores/debug.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS \
            -deststorepass android -destkeypass android -alias androiddebugkey -noprompt
          # Gradle signe les builds avec `android/app/debug.keystore` (créé par prebuild,
          # NEUF à chaque machine). On y met la MÊME clé fixe, sinon chaque APK porte
          # une empreinte différente et Google refuse la connexion.
          mkdir -p android/app
          cp "$HOME/.android/debug.keystore" android/app/debug.keystore
          SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey \
            | awk '/SHA1:/ {print $2}')
          if [ "$SHA1" != "4D:0B:91:84:E6:15:F1:76:4A:E3:08:C4:46:49:7E:DB:1A:6E:05:3E" ]; then
            echo "::error title=Clé de démonstration::empreinte SHA-1 inattendue : ${SHA1:-vide}"
            exit 1
          fi
          echo "::notice title=Clé de démonstration::SHA-1 fixe OK ($SHA1)"
          SHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$SHA" ]; then
            echo "::error title=Empreinte de démonstration::introuvable — la clé fixe n'a pas pu être importée"
            exit 1
          fi
          # Le serveur publie cette valeur sur les déploiements `arena/*`.
          # Comparer à la clé réellement importée empêche un assetlinks 200 mais
          # inutilisable après un remplacement accidentel du certificat.
          DECLARED_SHA=$(sed -n "s/^export const ANDROID_APP_LINK_DEMO_SHA256 = '\([^']*\)';$/\1/p" ../../shared/appLinks.ts)
          if [ "$SHA" != "$DECLARED_SHA" ]; then
            echo "::error title=Empreinte App Links incohérente::APK=$SHA serveur=${DECLARED_SHA:-absente}"
            exit 1
          fi
          echo "::notice title=Empreinte de démonstration::$SHA (APK = serveur App Links)"
          echo "ANDROID_DEBUG_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Identifiant + libellé de la démo (dans la CI uniquement)
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'app.ayrovi.mobile'/applicationId 'app.ayrovi.mobile.demo'/" app/build.gradle
          sed -i 's|<string name="app_name">ZAYROVI</string>|<string name="app_name">ZAYROVI Démo</string>|' app/src/main/res/values/strings.xml
          # Vérification réelle : si le motif avait changé, on échoue AU LIEU de
          # produire un APK qui écraserait l'application installée.
          grep -q "applicationId 'app.ayrovi.mobile.demo'" app/build.gradle
          grep -q '<string name="app_name">ZAYROVI Démo</string>' app/src/main/res/values/strings.xml
          grep -n "applicationId" app/build.gradle
          grep -n "app_name" app/src/main/res/values/strings.xml

      # `assembleRelease` produit un APK AUTONOME (bundle JS embarqué), signé
      # avec la clé debug du modèle — donc installable sur un téléphone.
      # L'APK de production, lui, sera signé avec le vrai keystore (P6).
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          # `inputs` est vide sur un déclenchement par `push` → origine par
          # défaut. L'application exige une origine ABSOLUE : sans elle, le
          # réseau échoue (pas de serveur Metro dans un APK autonome).
          EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || 'https://ayrovi-beta1-moo8.onrender.com' }}
          EXPO_PUBLIC_BUILD_STAMP: ${{ github.sha }}
          EXPO_PUBLIC_APP_VERSION: "2.0.8"
          # Démo : cartes Hero embarquées tant que l'Admin n'a rien publié.
          EXPO_PUBLIC_HERO_DEMO: "1"
          # Connexion Google native : identifiant Web (public, pas un secret). Le serveur
          # le reçoit en GOOGLE_CLIENT_ID : les deux doivent être strictement identiques.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "917317804534-e37d2kardhtac1g7fummsfk61dr86q3j.apps.googleusercontent.com"
        run: |
          set -o pipefail
          # Contexte de la machine : un échec de build vient souvent du disque
          # ou de la mémoire, pas du code.
          echo "--- machine ---"; df -h / | tail -1; free -m | head -2
          echo "--- java ---"; java -version 2>&1 | head -2
          if ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log; then
            exit 0
          fi
          # Le journal complet n'est pas consultable partout : l'échec est publié
          # en annotation (dernières lignes + causes), lisible depuis l'API.
          python3 ../scripts/gradle-diagnose.py /tmp/gradle.log "APK démo : Gradle a échoué"
          exit 1

      # ── Taille et signature ────────────────────────────────────────────────
      # Le découpage par ABI (voir `app.json` → expo-build-properties) produit
      # PLUSIEURS APK au lieu d'un seul universel. Le chemin n'est donc plus
      # figé : on prend ce que Gradle a réellement produit, et on ANNONCE les
      # tailles — un réglage de poids qu'on ne mesure pas est un réglage qu'on
      # suppose.
      - name: Taille et signature des APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          shopt -s nullglob
          mapfile -t APKS < <(ls -1 app/build/outputs/apk/release/*.apk | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::aucun APK produit dans app/build/outputs/apk/release"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "### APK produits" >> "$GITHUB_STEP_SUMMARY"
          echo "| fichier | taille |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in "${APKS[@]}"; do
            size="$(du -h "$apk" | cut -f1)"
            echo "| $(basename "$apk") | $size |" >> "$GITHUB_STEP_SUMMARY"
            echo "--- $(basename "$apk") : $size ---"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
            # Diagnostic (lecture seule) : empreinte SHA-1 RÉELLE de la signature de
            # l'APK, à comparer avec le client Android Google Cloud. N'arrête jamais le build.
            raw="$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | sed -n 's/.*SHA-1 digest: //p' | head -1 || true)"
            sha1="$(printf '%s' "$raw" | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
            echo "- Empreinte SHA-1 de la signature de $(basename "$apk") : \`${sha1:-introuvable}\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$sha1" != "4D:0B:91:84:E6:15:F1:76:4A:E3:08:C4:46:49:7E:DB:1A:6E:05:3E" ]; then
              echo "::warning title=Empreinte APK::signature différente de la clé de démonstration fixe (${sha1:-vide})"
            fi
          done

          # La mesure est aussi RÉÉCRITE dans le dépôt. Un chiffre qu'on ne
          # peut plus relire finit toujours par être réinventé : les journaux
          # CI se perdent, les artefacts expirent au bout de 30 jours. La
          # publier la rend vérifiable par un simple `git pull` — pour nous
          # comme pour la personne qui relit.
          REPORT="${{ github.workspace }}/apps/mobile/APK_SIZES.md"
          {
            echo "# Tailles d'APK — mesurées"
            echo
            echo "Dernière mesure : $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "Commit mesuré : \`${GITHUB_SHA}\`"
            echo
            echo "Écrit automatiquement par \`Mobile — APK Android (démo)\`."
            echo "Ne pas éditer à la main : réécrit à chaque build."
            echo
            echo "| fichier | taille |"
            echo "|---|---|"
            for apk in "${APKS[@]}"; do
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
            done
          } > "$REPORT"
          echo "--- rapport écrit : $REPORT ---"
          cat "$REPORT"

      - uses: actions/upload-artifact@v4
        with:
          name: ZAYROVI-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'APK dans une Release (lien direct, sans connexion)
        # Le lien d'artifact exige une connexion GitHub. Une Release donne un lien de
        # téléchargement direct. Un tag par commit : rien n'est écrasé. Échec ⇒ avertissement,
        # le build reste vert (l'APK reste dans l'artifact).
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="apk-${SHORT}"
          APK_SRC=$(ls "$GITHUB_WORKSPACE"/apps/mobile/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::warning::APK introuvable — pas de Release"
            exit 0
          fi
          APK="$RUNNER_TEMP/ZAYROVI-demo-${SHORT}.apk"
          cp "$APK_SRC" "$APK"
          NOTES="APK démo — commit \`${GITHUB_SHA}\`. Build : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
            --title "APK démo ${SHORT}" --notes "$NOTES" \
            || echo "::warning::publication de la Release impossible"

      - name: Publier la démo « toujours la plus récente » (lien permanent)
        # UN SEUL LIEN, TOUJOURS À JOUR :
        #   https://github.com/<dépôt>/releases/download/apk-demo-latest/ZAYROVI-Demo.apk
        #
        # Pourquoi ce doublon de la Release par commit (`apk-<commit>` ci-dessus) :
        # la Release par commit est IMMUABLE — elle dit « voici exactement ce qui a
        # été testé », et rien n'y est écrasé. Mais son lien change à chaque
        # commit : il faut les chaser un par un dans l'onglet Releases, et on
        # installe souvent la VIEILLE version par automatisme. Ce tag mobile,
        # lui, est remplacé à chaque build réussi : on garde le même lien dans
        # son marque-page, on le télécharge, et c'est la dernière version.
        #
        # L'APK de démo s'installe PAR-DESSUS le précédent (même package
        # `app.ayrovi.mobile.demo`, même clé de démo fixe) : c'est une mise à
        # jour, pas une deuxième application à désinstaller.
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="apk-demo-latest"
          OUT="$GITHUB_WORKSPACE/apps/mobile/android/app/build/outputs/apk/release"

          # On privilégie l'APK arm64-v8a : c'est l'architecture de tous les
          # téléphones d'aujourd'hui, et le fichier pèse bien moins que
          # l'universel (qui embarque les deux). Repli sur l'universel, puis
          # sur le premier fichier produit — on ne devine jamais : on publie
          # ce que Gradle a réellement sorti.
          APK_SRC=""
          for candidate in "$OUT"/app-arm64-v8a-release.apk "$OUT"/app-release.apk; do
            if [ -f "$candidate" ]; then APK_SRC="$candidate"; break; fi
          done
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(ls -1 "$OUT"/*.apk 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK_SRC" ]; then
            echo "::warning::APK introuvable dans $OUT — pas de démo « latest »"
            ls -la "$OUT" 2>/dev/null || true
            exit 0
          fi
          echo "APK publié : $(basename "$APK_SRC") ($(du -h "$APK_SRC" | cut -f1))"

          APK="$RUNNER_TEMP/ZAYROVI-Demo.apk"
          cp "$APK_SRC" "$APK"
          NOTES="Démo ZAYROVI — dernier build réussi (commit \`${GITHUB_SHA}\`). Build : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release déjà là : on REMPLACE l'asset (même nom) et on déplace le
            # tag sur le commit courant. `--clobber` écrase l'asset existant ;
            # sans lui, le deuxième build se heurterait à un nom déjà pris.
            gh release upload "$TAG" "$APK" --clobber \
              || echo "::warning::remplacement de l'asset « latest » impossible"
            # Le tag doit suivre le commit : c'est lui qui dit de quelle version
            # il s'agit. `force=true` : un tag n'est jamais « bloqué », ici on
            # veut explicitement le déplacer.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || echo "::warning::déplacement du tag « latest » impossible"
            gh release edit "$TAG" --notes "$NOTES" --prerelease \
              --title "ZAYROVI Démo (dernière version)" >/dev/null \
              || echo "::warning::mise à jour des notes impossible"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
              --title "ZAYROVI Démo (dernière version)" --notes "$NOTES" \
              || echo "::warning::publication de la démo « latest » impossible"
          fi
          echo "::notice title=Démo prête::https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ZAYROVI-Demo.apk"
      - name: Publier la mesure dans le dépôt
        # ⚠️ Deux leçons, payées par un build rouge :
        #
        # 1. Ce job a `defaults.run.working-directory: apps/mobile`. Un chemin
        #    RELATIF dans cette étape devenait « apps/mobile/apps/mobile/… », et
        #    `git add` échouait — alors que le fichier existait bien. D'où
        #    `git -C "$REPO"` partout : le dépôt est désigné en absolu, plus
        #    jamais relativement au dossier courant.
        #
        # 2. Il n'y a PAS de `set -e` ici, volontairement. Avec lui, un simple
        #    `git add` sur un fichier absent faisait échouer TOUT LE BUILD —
        #    alors que l'APK était construit, signé et téléversé. Un rapport ne
        #    doit jamais rendre rouge un build vert : on prévient et on passe.
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          REPO="${{ github.workspace }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          REPORT="apps/mobile/APK_SIZES.md"

          # Diagnostic : si le fichier manque, on le DIT au lieu de mourir.
          if [ ! -f "$REPO/$REPORT" ]; then
            echo "::warning::$REPORT absent — l'étape de mesure ne l'a pas produit ; rien à publier"
            ls -la "$REPO/apps/mobile" || true
            exit 0
          fi

          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$REPO" add "$REPORT" || {
            echo "::warning::git add impossible, mesure non publiée"
            exit 0
          }

          if git -C "$REPO" diff --cached --quiet; then
            echo "tailles inchangées — rien à publier"
            exit 0
          fi

          # [skip ci] : sans lui ce commit redéclencherait ce workflow, qui
          # recommencerait, et ainsi de suite.
          # [skip render] : Render n'honore PAS [skip ci] ; sans cette phrase, ce
          # commit de mesure (aucun code serveur) redéploierait le serveur de la
          # branche — avec coupure, le service ayant un disque persistant.
          git -C "$REPO" commit -m "chore(apk): tailles mesurées — ${GITHUB_SHA::7} [skip ci] [skip render]" || {
            echo "::warning::commit impossible, mesure non publiée"
            exit 0
          }
          git -C "$REPO" pull --rebase --autostash origin "$BRANCH" || {
            echo "::warning::réconciliation impossible, mesure non publiée"
            exit 0
          }
          git -C "$REPO" push origin "HEAD:$BRANCH" || {
            echo "::warning::publication impossible, la mesure reste dans le résumé CI"
            exit 0
          }
      # Le commit bot ci-dessus est poussé avec le GITHUB_TOKEN : aucun
      # workflow ne se déclenche dessus, le head du PR n'a donc AUCUN check
      # et la PR reste bloquée (« required checks missing »). On rallume les
      # vérifications PR en dispatchant les deux workflows sur la branche
      # (`workflow_dispatch` est exempté de la règle GITHUB_TOKEN). Sans effet
      # de bord : aucun de ces deux workflows ne committe, donc pas de boucle.
      - name: Rallume les vérifications PR sur le head (commit bot)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::dispatch ci.yml impossible"
          gh workflow run mobile.yml --ref "$BRANCH" || echo "::warning::dispatch mobile.yml impossible"
