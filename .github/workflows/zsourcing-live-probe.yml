# Z Sourcing — نقطة التوقف الأولى: شواهد حية من الخادم المنشور (أمر المالك 28/11).
# runner GitHub يتصل بRender بحرية حيث بيئة التطوير محجوبة عن النطاقات.
# السكريبت Node خالص (صفر اعتماديات — لا npm ci، لا vitest)، ولا يحمل رموزاً —
# العنوان من input والمفتاح يبقى في Render env.
# Node مثبّت 22.23.4 حرفياً — scripts/check-node-security.cjs يشترط مطابقة .nvmrc.
name: "Z Sourcing — sonde vivante (point d'arrêt)"

on:
  # الإطلاق الذاتي: أي push يلمس الجامع نفسه يشغّل الشواهد (حيلة تسجيل الفرع).
  push:
    paths:
      - ".github/workflows/zsourcing-live-probe.yml"
      - "tests/zsourcing-live-probe.mjs"
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL du serveur publié"
        required: false
        default: "https://ayrovi-beta1-moo8.onrender.com"

permissions:
  contents: read

jobs:
  live-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Live checkpoint probe (pure Node — no install)
        env:
          ZS_LIVE_BASE_URL: ${{ inputs.base || 'https://ayrovi-beta1-moo8.onrender.com' }}
        run: |
          set -o pipefail
          node tests/zsourcing-live-probe.mjs 2>&1 | tee /tmp/probe.log
          code=$?
          # الشواهد تصعد annotations — تُقرأ من gh run view بلا وصول للّوجز الخام
          grep '\[zsourcing-live\]' /tmp/probe.log | sed 's/::/──/g' | while IFS= read -r line; do
            echo "::notice title=ZS-live::${line#\[zsourcing-live\] }"
          done
          exit $code
