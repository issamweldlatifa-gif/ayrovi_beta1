apply plugin: 'com.android.application'

// Signing release uniquement quand la CI fournit le keystore (env), jamais en local/debug.
def ksB64 = System.getenv('AYROVI_KEYSTORE_BASE64')
def hasReleaseKeystore = ksB64 != null && !ksB64.trim().isEmpty()
def ksFile = hasReleaseKeystore ? new File(buildDir, 'ayrovi-release.keystore') : null
if (hasReleaseKeystore) {
    buildDir.mkdirs()
    ksFile.bytes = Base64.decoder.decode(ksB64.replaceAll('\\s', ''))
}

android {
    namespace "app.ayrovi.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        def apiOrigin = System.getenv('VITE_AYROVI_API_ORIGIN') ?: 'https://ayrovi-beta1-1.onrender.com'
        def apiUri = new URI(apiOrigin)
        if (apiUri.scheme != 'https' || !apiUri.host || apiUri.userInfo || apiUri.query || apiUri.fragment || (apiUri.path && apiUri.path != '/') || (apiUri.port != -1 && apiUri.port != 443)) {
            throw new GradleException('HTTPS_API_ORIGIN_REQUIRED')
        }
        buildConfigField 'String', 'AYROVI_API_ORIGIN', '"' + apiOrigin.replaceAll('/+$', '') + '"'

        applicationId "app.ayrovi.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Repli = version COURANTE du paquet (04/10/2026 : correctifs des sept
        // remarques d'interface + connexion Google dans l'app). La CI continue
        // d'imposer la sienne par AYROVI_VERSION_CODE / AYROVI_VERSION_NAME ;
        // un build local produit désormais le même numéro que la release, donc
        // s'installe PAR-DESSUS la 1.0.2 au lieu d'être refusé.
        versionCode ((System.getenv('AYROVI_VERSION_CODE') ?: '6') as int)
        versionName (System.getenv('AYROVI_VERSION_NAME') ?: '1.0.6')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile ksFile
                storePassword System.getenv('AYROVI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AYROVI_KEY_ALIAS')
                keyPassword System.getenv('AYROVI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Always use the Android debug certificate, never release credentials.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Onglet personnalisé : connexion par fournisseur DANS l'application
    // (04/10/2026). Google refuse les WebView embarquées, et le navigateur
    // système fait sortir l'utilisateur ; l'onglet personnalisé est la seule
    // voie qui soit à la fois acceptée par Google et sans bascule d'app.
    implementation "androidx.browser:browser:1.8.0"
    // ── Sélecteur de compte NATIF (04/10/2026) ───────────────────────────────
    // Credential Manager affiche la feuille de comptes du système : aucune
    // page web, aucun onglet, aucune bascule d'application. C'est la seule
    // manière d'obtenir la connexion Google « sans sortir » que le client
    // demande ; l'onglet personnalisé reste le repli quand les services Google
    // Play sont absents de l'appareil.
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
