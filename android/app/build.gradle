apply plugin: 'com.android.application'

// Le keystore n'est chargé que si des variables d'environnement sont explicitement fournies.
def ksB64 = System.getenv('AYROVI_KEYSTORE_BASE64')
def hasReleaseKeystore = ksB64 != null && !ksB64.trim().isEmpty()
def ksFile = hasReleaseKeystore ? new File(buildDir, 'ayrovi-release.keystore') : null
if (hasReleaseKeystore) {
    buildDir.mkdirs()
    ksFile.bytes = Base64.decoder.decode(ksB64.replaceAll('\\s', ''))
}

android {
    namespace "app.ayrovi.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.ayrovi.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Repli = version courante de cette mise à jour (Google natif sans
        // bascule vers Custom Tab + écran Android compact, 05/10/2026). La CI
        // peut toujours injecter une version supérieure pour une publication.
        versionCode ((System.getenv('AYROVI_VERSION_CODE') ?: '7') as int)
        versionName (System.getenv('AYROVI_VERSION_NAME') ?: '1.0.7')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile ksFile
                storePassword System.getenv('AYROVI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AYROVI_KEY_ALIAS')
                keyPassword System.getenv('AYROVI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // ── Empreinte SHA-1 STABLE (04/10/2026) ───────────────────────
            // Google n'identifie pas « l'application » mais le CERTIFICAT qui
            // la signe. Sans keystore fourni, Gradle en fabrique un au vol :
            // chaque machine, chaque CI produit alors une empreinte
            // différente, et le SHA-1 déclaré chez Google ne correspond plus
            // à rien dès le build suivant. Signer aussi le debug avec le
            // keystore officiel rend l'empreinte permanente.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Custom Tabs pour les fournisseurs OAuth qui n'ont pas de sélecteur natif
    // intégré. Le parcours Google Android passe par Credential Manager ci-dessous.
    implementation "androidx.browser:browser:1.8.0"
    // ── Sélecteur de compte NATIF (04/10/2026) ───────────────────────────────
    // Credential Manager affiche la feuille de comptes du système : aucune
    // page web, aucun onglet, aucune bascule d'application. En cas d'annulation
    // ou d'indisponibilité, l'app reste sur AYROVI — pas de repli automatique
    // vers un Custom Tab Google.
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
