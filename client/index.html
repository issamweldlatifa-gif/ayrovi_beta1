    <style>
      /* ZAYROVI — écran de chargement : le symbole « Za. » (cercle jaune + z évidé) au centre d'un anneau clair, un arc plus
         foncé tourne pendant que l'application se charge (maquette du 2026-10-16).
         Statique et inline : visible dès le HTML analysé, avant tout JavaScript. React
         remplace ce contenu au premier rendu ; le fallback Suspense (main.tsx) affiche le
         même écran — aucune page blanche. Couleurs = jetons : fond #FFFFFF (canvas), anneau
         #E5E5E5 (--zayrovi-border-soft), arc #666666 (--zayrovi-text-secondary), symbole jaune #F2AE00 (BRAND.yellow). */
      .ay-boot { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: #FFFFFF; }
      .ay-boot-svg { width: 136px; height: 136px; overflow: visible; }
      .ay-boot-track { fill: none; stroke: #E5E5E5; stroke-width: 4; }
      .ay-boot-arc { fill: none; stroke: #666666; stroke-width: 6; stroke-linecap: round; transform-box: view-box; transform-origin: 68px 68px; animation: ay-boot-turn 1.1s linear infinite; }
      .ay-boot-symbol { fill: #F2AE00; }
      @keyframes ay-boot-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .ay-boot-arc { animation: none; }
      }
    </style>
  </head>
  <body class="min-h-screen overflow-x-clip bg-white text-ink antialiased selection:bg-brand selection:text-white">
    <div id="root">
      <div class="ay-boot" role="status" aria-label="ZAYROVI">
