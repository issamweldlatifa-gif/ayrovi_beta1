* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0A0A0A; font-family: ZS, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
.phone { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #0A0A0A; color: #fff; user-select: none; -webkit-user-select: none; }
.status, .home { display: none; }
@media (min-width: 600px) {
  body { background: #F2F2F2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0; }
  .phone { width: 390px; height: 844px; border-radius: 40px; box-shadow: 0 12px 36px rgba(0,0,0,.2); }
  .status { display: flex; position: absolute; top: 12px; left: 28px; right: 26px; justify-content: space-between; font-size: 13px; font-weight: 600; z-index: 3; }
  .home { display: block; position: absolute; bottom: 8px; left: 50%; width: 124px; margin-left: -62px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.85); z-index: 3; }
  .top { top: 40px !important; }
}
.feed { position: absolute; left: 0; top: 0; width: 100%; height: 128%; object-fit: cover; object-position: 40% 50%; }
.shade-top { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,0)); }
.top { position: absolute; top: 10px; left: 8px; right: 8px; height: 46px; display: flex; align-items: center; z-index: 3; }
.ib { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; border-radius: 22px; }
.ib:active { background: rgba(255,255,255,.14); }
.grow { flex: 1; }
.title { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; letter-spacing: .01em; pointer-events: none; }
.frame { position: absolute; left: 16.5%; right: 16.5%; top: 23%; height: 37%; }
.frame.sq { left: 19%; right: 19%; top: 26%; height: auto; aspect-ratio: 1 / 1; }
.frame i { position: absolute; width: 50px; height: 50px; border: 0 solid rgba(255,255,255,.92); }
.tl { left: 0; top: 0; border-top-width: 3px !important; border-left-width: 3px !important; border-top-left-radius: 22px; }
.tr { right: 0; top: 0; border-top-width: 3px !important; border-right-width: 3px !important; border-top-right-radius: 22px; }
.bl { left: 0; bottom: 0; border-bottom-width: 3px !important; border-left-width: 3px !important; border-bottom-left-radius: 22px; }
.br { right: 0; bottom: 0; border-bottom-width: 3px !important; border-right-width: 3px !important; border-bottom-right-radius: 22px; }
.qr-label { position: absolute; left: 50%; top: 50%; width: 64%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%) rotate(-4deg); background: #fff; border-radius: 12px; padding: 7%; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.qr-label svg { width: 100%; height: 100%; display: block; }
.off { position: absolute; left: 36px; right: 36px; top: 27%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.off-ic { width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.off b { font-size: 19px; font-weight: 600; }
.off span { font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.72); }
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: calc(238px + env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0; background: rgba(10,10,10,.62); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); z-index: 2; }
.seg { position: absolute; left: 14px; right: 14px; top: 16px; height: 46px; border-radius: 23px; background: rgba(255,255,255,.13); display: flex; padding: 4px; }
.seg button { flex: 1; border-radius: 19px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .18s, color .18s; }
.seg button.on { background: #C5B2F4; color: #0A0A0A; }
.pc { display: none; }
.capture { position: absolute; left: 0; right: 0; top: 80px; align-items: center; justify-content: space-between; padding: 0 30px; }
.side { width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.side .c { width: 54px; height: 54px; border-radius: 50%; background: rgba(10,10,10,.5); border: 1.5px solid rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; }
.side:active .c { background: rgba(255,255,255,.18); }
.shutter { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; margin-bottom: 19px; }
.shutter .d { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; transition: transform .12s; }
.shutter:active .d { transform: scale(.92); }
.hint { position: absolute; left: 22px; right: 22px; top: 92px; gap: 14px; align-items: flex-start; }
.hint b { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
.hint span { display: block; font-size: 13.5px; color: rgba(255,255,255,.72); margin-top: 6px; }
.text-zone { position: absolute; left: 16px; right: 16px; top: 78px; flex-direction: column; gap: 10px; }
.field { height: 52px; border-radius: 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; }
.field:focus-within { border-color: #C5B2F4; }
.field input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: #fff; font-size: 15px; }
.field input::placeholder { color: rgba(255,255,255,.62); }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; background: #fff; color: #0A0A0A !important; font-size: 13px; font-weight: 600; display: flex; align-items: center; flex: none; }
.btn { height: 52px; border-radius: 14px; background: #fff; color: #0A0A0A !important; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; width: 100%; }
.btn:active, .chip:active { opacity: .85; }
/* modes */
.phone[data-mode="lien"] .cam, .phone[data-mode="mot"] .cam { display: none !important; }
.frame.rect, .frame.sq, .off { display: none; }
.phone[data-mode="live"] .frame.rect, .phone[data-mode="qr"] .frame.sq { display: block; }
.phone[data-mode="lien"] .off.lien, .phone[data-mode="mot"] .off.mot { display: flex; }
.phone[data-mode="live"] .pc-live, .phone[data-mode="qr"] .pc-qr, .phone[data-mode="lien"] .pc-lien, .phone[data-mode="mot"] .pc-mot { display: flex; }
/* menu */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 4; display: none; }
.menu { position: absolute; top: 58px; right: 12px; width: 268px; background: #fff; color: #0A0A0A; border-radius: 16px; padding: 6px 0; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 5; display: none; }
@media (min-width: 600px) { .menu { top: 88px; } }
.dim.open, .menu.open { display: block; }
.menu .it { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 18px; font-size: 15px; width: 100%; text-align: left; }
.menu .it:active { background: #F2F2F2; }
.menu .sep { height: 1px; background: #E6E6E6; margin: 5px 0; }
/* retours visuels de l'aperçu */
.fx { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6; }
.fx.go { animation: fx .38s ease-out; }
@keyframes fx { 0% { opacity: .85; } 100% { opacity: 0; } }
.toast { position: absolute; left: 50%; top: 72px; transform: translate(-50%, -8px); max-width: 86%; padding: 10px 16px; border-radius: 20px; background: rgba(10,10,10,.88); color: #fff; font-size: 13.5px; line-height: 1.35; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 7; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

      <button class="side" data-toast="Aperçu — ouvrirait OCEREX (le prix depuis une photo)"><span class="c"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;flex:none" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"/></svg></span><span>OCEREX</span></button>
    </div>
    <div class="pc pc-qr hint"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;flex:none" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg><div><b>Placez le QR code ou le code-barres dans le cadre.</b><span>La recherche démarre toute seule.</span></div></div>
    <div class="pc pc-lien text-zone">
      <label class="field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,.75);flex:none" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg><input id="in-lien" type="url" inputmode="url" placeholder="Collez le lien du produit" autocomplete="off"><button class="chip" data-act="paste">Coller</button></label>
      <button class="btn" data-act="search" data-for="in-lien">Rechercher</button>
    </div>
    <div class="pc pc-mot text-zone">
      <label class="field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,.75);flex:none" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="in-mot" type="search" enterkeyhint="search" placeholder="Nom ou référence du produit" autocomplete="off"></label>
      <button class="btn" data-act="search" data-for="in-mot">Rechercher</button>
    </div>
  </section>

  <div class="status"><span>5:08</span><span>4G ▮▮▮ 50%</span></div>
  <header class="top">
    <button class="ib" data-toast="Aperçu — retour à l’accueil" aria-label="Retour"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;flex:none" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
    <button class="ib cam" data-act="flash" aria-label="Lampe"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;flex:none" aria-hidden="true"><path d="M13 3 6 13h5l-1 8 7-10h-5l1-8z"/><path d="M4 4l16 16"/></svg></button>
    <div class="title">Z Lens</div><div class="grow"></div>
    <button class="ib" data-act="menu" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;flex:none" aria-hidden="true"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg></button>
  </header>

  <div class="dim"></div>
  <nav class="menu">
    <button class="it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0A0A0A;flex:none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/></svg><span>Informations</span></button>
    <button class="it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0A0A0A;flex:none" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/><path d="M12 7.5V12l3 2"/></svg><span>Historique</span></button>
    <div class="sep"></div>
    <button class="it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0A0A0A;flex:none" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.6-3 7.9-7 9.5-4-1.6-7-4.9-7-9.5V6l7-3z"/></svg><span>Politique de confidentialité</span></button>
    <button class="it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0A0A0A;flex:none" aria-hidden="true"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8l-5-5z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7"/></svg><span>Conditions d’utilisation</span></button>
    <button class="it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#0A0A0A;flex:none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg><span>Produits interdits</span></button>
  </nav>
  <div class="fx"></div>
  <div class="toast" role="status"></div>
  <div class="home"></div>
</main>
<script>
(() => {
  const ph = document.querySelector('.phone');
  const toastEl = document.querySelector('.toast');
  const menu = document.querySelector('.menu');
  const dim = document.querySelector('.dim');
  const fx = document.querySelector('.fx');
  const FLASH_OFF = "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#fff;flex:none\" aria-hidden=\"true\"><path d=\"M13 3 6 13h5l-1 8 7-10h-5l1-8z\"/><path d=\"M4 4l16 16\"/></svg>";
  const FLASH_ON = "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#fff;flex:none\" aria-hidden=\"true\"><path d=\"M13 3 6 13h5l-1 8 7-10h-5l1-8z\" fill=\"currentColor\"/></svg>";
  let timer, flash = false;
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => toastEl.classList.remove('show'), 1800); };
  const closeMenu = () => { menu.classList.remove('open'); dim.classList.remove('open'); };
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
    ph.dataset.mode = b.dataset.mode;
    closeMenu();
  }));
  document.querySelectorAll('[data-toast]').forEach((b) => b.addEventListener('click', () => toast(b.dataset.toast)));
  document.querySelector('[data-act=menu]').addEventListener('click', () => { const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); dim.classList.toggle('open', open); });
  dim.addEventListener('click', closeMenu);
  menu.querySelectorAll('.it').forEach((it) => it.addEventListener('click', () => { closeMenu(); toast('Aperçu — ouvrirait « ' + it.textContent.trim() + ' »'); }));
  const fl = document.querySelector('[data-act=flash]');
  fl.addEventListener('click', () => { flash = !flash; fl.innerHTML = flash ? FLASH_ON : FLASH_OFF; toast(flash ? 'Lampe allumée' : 'Lampe éteinte'); });
  document.querySelector('[data-act=shoot]').addEventListener('click', () => { fx.classList.remove('go'); void fx.offsetWidth; fx.classList.add('go'); toast('Aperçu — la photo serait analysée'); });
  document.querySelector('[data-act=paste]').addEventListener('click', async (e) => {
    e.preventDefault();
    const input = document.getElementById('in-lien');
    try { const t = await navigator.clipboard.readText(); if (t) { input.value = t.trim(); return; } } catch (_) {}
    input.focus();
  });
  document.querySelectorAll('[data-act=search]').forEach((b) => b.addEventListener('click', () => {
    const input = document.getElementById(b.dataset.for);
    const v = input.value.trim();
    if (!v) { toast(b.dataset.for === 'in-lien' ? 'Collez d’abord le lien du produit' : 'Écrivez d’abord le nom du produit'); input.focus(); return; }
    input.blur();
    toast('Aperçu — recherche : « ' + (v.length > 40 ? v.slice(0, 40) + '…' : v) + ' »');
  }));
  document.querySelectorAll('.field input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') i.closest('.pc').querySelector('[data-act=search]').click(); }));
})();
</script>
</body></html>
