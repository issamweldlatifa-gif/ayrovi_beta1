services:
  - type: web
    name: ayrovi
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    disk:
      name: ayrovi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/qatafo.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_AUTH_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CUSTOMER_OTP_PROVIDER
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_URL
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_TOKEN
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ASSISTANT_HAIKU_MODEL
        value: claude-haiku-4-5-20251001
      - key: ASSISTANT_SONNET_MODEL
        value: claude-sonnet-4-5-20250929
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: SERPAPI_KEY
        sync: false
      - key: AYROVIX_VISUAL_SEARCH_TIMEOUT_MS
        value: 10000
      - key: AYROVIX_LENS_COUNTRY
        value: fr
      - key: AYROVIX_ANTHROPIC_WEB_SEARCH
        value: true
      - key: AYROVIX_PROVIDER_TIMEOUT_MS
        value: 12000
      - key: AYROVIX_QUOTE_SECRET
        sync: false
      - key: AYROVIX_RENDER_PROVIDER
        value: auto
      - key: AYROVIX_RENDER_TIMEOUT_MS
        value: 18000
      - key: AYROVIX_SCRAPER_COUNTRY
        value: fr
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPINGBEE_API_KEY
        sync: false
      - key: AYROVIX_SCRAPER_PREMIUM
        value: 'false'
      - key: AYROVIX_SCRAPINGBEE_STEALTH
        value: 'false'
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: AYROVIX_OCR_TIMEOUT_MS
        value: 7000
      - key: AYROVIX_SEARCH_TIMEOUT_MS
        value: 7000
