services:
  - type: web
    name: ayrovi
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ayrovi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/qatafo.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_AUTH_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CUSTOMER_OTP_PROVIDER
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_URL
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_TOKEN
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AYROVIX_ALLOW_LOCAL_FALLBACK
        value: false
      - key: AYROVIX_PRIMARY_PROVIDER
        value: anthropic
      - key: AYROVIX_ANTHROPIC_WEB_SEARCH
        value: true
      - key: AYROVIX_ALLOW_HTML_SEARCH_FALLBACK
        value: false
      - key: AYROVIX_AI_TIMEOUT_MS
        value: 14000
      - key: AYROVIX_PROVIDER_TIMEOUT_MS
        value: 5000
      - key: AYROVIX_OCR_TIMEOUT_MS
        value: 7000
      - key: AYROVIX_SEARCH_TIMEOUT_MS
        value: 7000
      - key: SERPAPI_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
