services:
  - type: web
    name: ayrovi
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    disk:
      name: ayrovi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/qatafo.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_AUTH_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Konnect Tunisia card gateway (server-side; never expose these values to Vite).
      - key: KONNECT_ENVIRONMENT
        value: production
      - key: KONNECT_API_KEY
        sync: false
      - key: KONNECT_WALLET_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
      - key: FACEBOOK_GRAPH_VERSION
        value: v26.0
      # Tunisian SMS providers integrate through the provider-independent HTTPS adapter.
      - key: CUSTOMER_OTP_PROVIDER
        value: webhook
      - key: CUSTOMER_OTP_WEBHOOK_URL
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_TOKEN
        sync: false
      # Optional legacy Twilio adapter; leave empty unless explicitly supported.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BACKUP_INTERVAL_HOURS
        value: 24
      - key: BACKUP_RETENTION_DAYS
        value: 14
      # Optional encrypted-at-rest S3-compatible destination (Cloudflare R2, B2 or S3).
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        value: ayrovi/sqlite
      - key: BACKUP_REQUIRE_EXTERNAL
        value: 'false'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ASSISTANT_HAIKU_MODEL
        value: claude-haiku-4-5-20251001
      - key: ASSISTANT_SONNET_MODEL
        value: claude-sonnet-4-5-20250929
      - key: MAGAZINE_AGENT_MODEL
        value: claude-sonnet-4-5-20250929
      # Optional stock-video providers for the admin-only Magazine Agent.
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      # Voice input (STT) and output (TTS), server-side only.
      # Temporary browser-only output keeps Gemini credentials intact while its quota is unavailable.
      - key: ASSISTANT_TTS_MODE
        value: browser
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_TIMEOUT_MS
        value: 20000
      # One controlled probe after the cooldown; HTTP 429 never loops per turn.
      - key: GEMINI_TTS_QUOTA_COOLDOWN_MS
        value: 3600000
      # Optional shared fallback for voice transcription and synthesis.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: SERPAPI_KEY
        sync: false
      - key: AYROVIX_VISUAL_SEARCH_TIMEOUT_MS
        value: 10000
      - key: AYROVIX_LENS_COUNTRY
        value: fr
      - key: AYROVIX_ANTHROPIC_WEB_SEARCH
        value: true
      - key: AYROVIX_PROVIDER_TIMEOUT_MS
        value: 12000
      - key: AYROVIX_QUOTE_SECRET
        sync: false
      - key: AYROVIX_RENDER_PROVIDER
        value: auto
      - key: AYROVIX_RENDER_TIMEOUT_MS
        value: 18000
      - key: AYROVIX_SCRAPER_COUNTRY
        value: fr
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPINGBEE_API_KEY
        sync: false
      - key: AYROVIX_SCRAPER_PREMIUM
        value: 'false'
      - key: AYROVIX_SCRAPINGBEE_STEALTH
        value: 'false'
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: AYROVIX_OCR_TIMEOUT_MS
        value: 7000
      - key: AYROVIX_SEARCH_TIMEOUT_MS
        value: 7000
