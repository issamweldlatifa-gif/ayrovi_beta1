services:
  - type: web
    name: ayrovi
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ayrovi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/node_modules/.cache/puppeteer
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/qatafo.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_AUTH_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CUSTOMER_OTP_PROVIDER
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_URL
        sync: false
      - key: CUSTOMER_OTP_WEBHOOK_TOKEN
        sync: false
